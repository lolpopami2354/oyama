<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Oyama Karate - White Belt Test Flashcards</title>
    <style>
        :root {
            --primary: #111;
            --accent: #d32f2f;
            --bg: #f5f5f7;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        /* Flashcard Container styling */
        .card-container {
            width: 100%;
            max-width: 450px;
            height: 280px;
            perspective: 1000px; /* Crucial for 3D flip effect */
            cursor: pointer;
            margin-bottom: 25px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 16px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 16px;
            border: 2px solid #e1e1e6;
            background: var(--card-bg);
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f9f9fb 100%);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #f9f9fb 0%, #f1f1f4 100%);
            border-color: var(--accent);
        }

        .category-tag {
            position: absolute;
            top: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(211, 47, 47, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .japanese-term {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
        }

        .english-meaning {
            font-size: 22px;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #999;
        }

        /* UI Controls styling */
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .progress {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>World Oyama Karate</h1>
        <div class="subtitle">White Belt (Mukyu) Test Flashcards</div>
    </header>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <!-- Front Face -->
            <div class="card-face card-front">
                <span class="category-tag" id="card-category">Category</span>
                <div class="japanese-term" id="card-front-text">Japanese Term</div>
                <div class="hint">Click to reveal meaning</div>
            </div>
            <!-- Back Face -->
            <div class="card-face card-back">
                <div class="english-meaning" id="card-back-text">English Translation</div>
                <div class="hint">Click to view term</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Prev</button>
        <div class="progress" id="card-progress">1 / 1</div>
        <button onclick="nextCard()">Next</button>
    </div>

    <script>
        // Official World Oyama White Belt Syllabus Dataset
        const syllabusData = [
            { category: "Tachi (Stances)", front: "Sanchin Dachi", back: "Three Battles / Pigeon-Toed Stance" },
            { category: "Tachi (Stances)", front: "Zenkutsu Dachi", back: "Front Leaning Stance" },
            { category: "Tachi (Stances)", front: "Kumite no Tachi", back: "Fighting Stance" },
            { category: "Te Waza (Hand Techniques)", front: "Seiken Zuki", back: "Forefist Straight Punch" },
            { category: "Te Waza (Hand Techniques)", front: "Seiken Ago Uchi", back: "Forefist Chin Strike" },
            { category: "Te Waza (Hand Techniques)", front: "Uraken", back: "Backfist Strike" },
            { category: "Keri Waza (Kicking)", front: "Hiza Geri", back: "Knee Kick" },
            { category: "Keri Waza (Kicking)", front: "Mae Geri", back: "Front Kick" },
            { category: "Keri Waza (Kicking)", front: "Mawashi Geri", back: "Roundhouse Kick" },
            { category: "Keri Waza (Kicking)", front: "Mae Keage", back: "Front High Straight Leg Kick" },
            { category: "Kata (Forms)", front: "Kihon Sono I", back: "Basic Form Number 1" },
            { category: "Kata (Forms)", front: "Shiho no Kata Sono I", back: "Four Directional Form Number 1" },
            { category: "Kata (Forms)", front: "Shiho no Kata Sono II", back: "Four Directional Form Number 2" },
            { category: "Kata (Forms)", front: "Ju-O Sono I", back: "Cross Form Number 1" }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');
        const categoryElement = document.getElementById('card-category');
        const frontTextElement = document.getElementById('card-front-text');
        const backTextElement = document.getElementById('card-back-text');
        const progressElement = document.getElementById('card-progress');

        function updateCard() {
            // Reset flip position smoothly before text swaps if active
            cardElement.classList.remove('flipped');
            
            // Timeout allows the card face down transition to hide text change seamlessly
            setTimeout(() => {
                const currentCard = syllabusData[currentIndex];
                categoryElement.innerText = currentCard.category;
                frontTextElement.innerText = currentCard.front;
                backTextElement.innerText = currentCard.back;
                progressElement.innerText = `${currentIndex + 1} / ${syllabusData.length}`;
            }, 150);
        }

        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % syllabusData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + syllabusData.length) % syllabusData.length;
            updateCard();
        }

        // Initialize first card layout on load
        updateCard();
    </script>
</body>
</html>
